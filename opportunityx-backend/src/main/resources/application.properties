# =============================================================================
# Opportunity-X – Spring Boot application configuration
# =============================================================================

spring.application.name=opportunityx-backend

# -----------------------------------------------------------------------------
# SQL Server connection
#
# OPTION A – Windows Authentication (default, no username/password needed)
# Works when running on the same Windows machine as SQL Server.
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=OpportunityX;encrypt=true;trustServerCertificate=true;integratedSecurity=true

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# -----------------------------------------------------------------------------
# OPTION B – SQL Server Authentication (username + password)
# Uncomment these three lines and comment out OPTION A above if you created a
# SQL Server login instead of using Windows Authentication.
# -----------------------------------------------------------------------------
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=OpportunityX;encrypt=true;trustServerCertificate=true
# spring.datasource.username=opportunityx_user
# spring.datasource.password=YourStrongPassword123!

# -----------------------------------------------------------------------------
# Connection pool (HikariCP – included automatically)
# -----------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# -----------------------------------------------------------------------------
# Server
# -----------------------------------------------------------------------------
server.port=8080

# -----------------------------------------------------------------------------
# Error handling – show structured error messages in responses
# -----------------------------------------------------------------------------
server.error.include-message=always
server.error.include-binding-errors=always
