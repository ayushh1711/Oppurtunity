
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Admin Login | Opportunity-X</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="navbar">
            <a href="index.html" class="brand brand-stacked">
                

                <div class="brand-row">
                    <img src="assets/opportunity-x-logo.png" alt="Opportunity-X Logo">
                    <span class="brand-text">
                        <strong>Opportunity-X</strong>
                        <small>Campus Opportunity Portal</small>
                    </span>
                </div>
            </a>

            <nav>
                <a href="index.html">Home</a>
                <a href="student-login.html">Student Login</a>
                <a href="admin-login.html">University Admin Login</a>
            </nav>
        </div>
    </header>

    <main class="container auth-container">
        <section class="auth-card">
            <h1>Club Admin Login</h1>
            <p>Sign in to manage your registered club, events and notices.</p>

            <form id="clubLoginForm">
                <div>
                    <label for="clubLoginUsername">Username</label>
                    <input
                        type="text"
                        id="clubLoginUsername"
                        name="username"
                        placeholder="Enter your club admin username"
                        required
                    >
                </div>

                <div>
                    <label for="clubLoginPassword">Password</label>
                    <input
                        type="password"
                        id="clubLoginPassword"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="btn">Login</button>
                <p id="clubLoginMessage" role="status"></p>
            </form>

            <p class="auth-footer">
                Has your club not been registered yet?
                <a href="admin-register.html">Register Your Club</a>
            </p>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
