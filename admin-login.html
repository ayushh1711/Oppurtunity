<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Admin Login | Opportunity-X</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="university-header">
        <a href="index.html" class="university-brand">
            <img src="assets/gehu-logo.png" alt="Graphic Era Hill University Logo" class="university-logo">
            <div class="university-text">
                <h2>Graphic Era Hill University</h2>
                <p>Dehradun, Uttarakhand</p>
            </div>
        </a>
        <span class="university-label">Administrator Portal</span>
    </header>

    <nav class="topnav">
        <a class="brand" href="index.html">Opportunity-X</a>
        <div class="links">
            <a href="index.html">Home</a>
            <a href="student-login.html">Student Login</a>
        </div>
    </nav>

    <main class="container">
        <div class="card" style="max-width: 480px; margin: 35px auto;">
            <h2>University Admin Login</h2>
            <p class="muted">Sign in to verify and approve club registration requests.</p>

            <form id="adminLoginForm">
                <div>
                    <label for="adminUsername">Username</label>
                    <input type="text" id="adminUsername" name="username" placeholder="Enter admin username"
                        autocomplete="username" required>
                </div>

                <div>
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" name="password" placeholder="Enter admin password"
                        autocomplete="current-password" required>
                </div>

                <button class="btn" type="submit">Login</button>
                <p id="adminLoginMessage" role="status" aria-live="polite"></p>
            </form>

            <p><a href="index.html">← Back to homepage</a></p>
        </div>
    </main>

    <footer class="footer">
        <p>Opportunity-X | Graphic Era Hill University</p>
        <p>University Administrator Portal</p>
    </footer>
    <script src="js/app.js"></script>
</body>

</html>
