
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Club Events | Opportunity-X</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="navbar">
            <a href="../index.html" class="brand brand-stacked">
                <div class="brand-row">
                    <img src="../assets/opportunity-x-logo.png" alt="Opportunity-X Logo">
                    <span class="brand-text">
                        <strong>Opportunity-X</strong>
                        <small>Campus Opportunity Portal</small>
                    </span>
                </div>
            </a>

            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="events.html" class="active">Manage Events</a>
                <a href="notices.html">Manage Notices</a>
                <a href="../club-login.html" id="clubLogout">Logout</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Manage Club Events</h1>
            <p>Create events and manage activities organised by your club.</p>
        </section>

        <section class="section">
            <div class="card">
                <h2>Create a New Event</h2>

                <form id="clubEventForm">
                    <div class="form-group">
                        <label for="clubEventTitle">Event Title</label>
                        <input type="text" id="clubEventTitle" required>
                    </div>

                    <div class="form-group">
                        <label for="clubEventDate">Event Date</label>
                        <input type="date" id="clubEventDate" required>
                    </div>

                    <div class="form-group">
                        <label for="clubEventSkills">Required Skills</label>
                        <input type="text" id="clubEventSkills" placeholder="Coding, Teamwork, Communication">
                    </div>

                    <div class="form-group">
                        <label for="clubEventDescription">Event Description</label>
                        <textarea id="clubEventDescription" rows="4" required></textarea>
                    </div>

                    <button type="submit" class="btn">Publish Event</button>
                    <p id="clubEventMessage" role="status"></p>
                </form>
            </div>
        </section>

        <section class="section">
            <h2>Your Club's Events</h2>
            <div id="clubManagedEventList" class="grid">
                <p>Loading your events...</p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>Opportunity-X | Club Administration Portal</p>
    </footer>

    <script src="../js/app.js"></script>
</body>
</html>
